name: lai-dev

services:
  db:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    environment:
      POSTGRES_DB: lai
      POSTGRES_USER: lai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lai_dev_db:/var/lib/postgresql/data
    networks:
      - private
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lai -d lai"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./.local/postgres.password

volumes:
  lai_dev_db:

networks:
  private:
    internal: true
