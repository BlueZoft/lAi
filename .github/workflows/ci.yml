name: CI

on:
  push:
    branches: [main]
    tags: ["t*-*", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install --disable-pip-version-check uv==0.13.6
      - name: Install locked dependencies
        run: make setup
      - name: Verify without external services or Internet sockets
        run: make verify
      - name: Validate Compose structure without starting a database
        run: docker compose config --quiet
      - name: Validate standalone no-network runtime controls without startup
        run: uv run --frozen --offline python scripts/validate_runtime.py
      - name: Synthetic acceptance report (public use remains NO-GO)
        run: make acceptance
